      overflow: hidden;

    let currentPool = [];
    let nextStagePool = [];
    let currentIndex = 0;
    let stageCount = 1;

    function showMenu() {
      document.getElementById("welcome-view").style.display = "none";
      document.getElementById("game-view").style.display = "none";
      document.getElementById("winner-view").style.display = "none";
      document.getElementById("menu-view").style.display = "flex";
    }

    function startBattle() {
      currentPool = [...initialItems];
      currentPool.sort(() => Math.random() - 0.5);
      nextStagePool = [];
      currentIndex = 0;
      stageCount = 1;

      document.getElementById("menu-view").style.display = "none";
      document.getElementById("game-view").style.display = "flex";

      renderRound();
    }

    function renderRound() {
      const totalRoundsInStage = Math.floor(currentPool.length / 2);
      const currentRound = Math.floor(currentIndex / 2) + 1;

      document.getElementById("stage-info").innerText = Этап ${stageCount};
      document.getElementById("round-info").innerText = Раунд ${currentRound} из ${totalRoundsInStage};

      const progressPercent = ((currentRound - 1) / totalRoundsInStage) * 100;
      document.getElementById("progress-bar").style.width = ${progressPercent}%;

      const item1 = currentPool[currentIndex];
      const item2 = currentPool[currentIndex + 1];

      document.getElementById("img-0").src = item1.img;
      document.getElementById("title-0").innerText = item1.name;

      document.getElementById("img-1").src = item2.img;
      document.getElementById("title-1").innerText = item2.name;
    }

    function selectFood(selectedIndex) {
      const chosenItem = currentPool[currentIndex + selectedIndex];
      nextStagePool.push(chosenItem);

      currentIndex += 2;

      if (currentIndex >= currentPool.length - (currentPool.length % 2)) {
        if (currentPool.length % 2 !== 0) {
          nextStagePool.push(currentPool[currentPool.length - 1]);
        }

        if (nextStagePool.length === 1) {
          showWinner(nextStagePool[0]);
          return;
        }

        currentPool = [...nextStagePool];
        nextStagePool = [];
        currentIndex = 0;
        stageCount++;
      }

      renderRound();
    }

    function showWinner(winner) {
      document.getElementById("game-view").style.display = "none";
      document.getElementById("winner-view").style.display = "block";
      document.getElementById("winner-img").src = winner.img;
      document.getElementById("winner-title").innerText = winner.name;
    }

    document.getElementById("card-0").addEventListener("click", function() { selectFood(0); });
    document.getElementById("card-1").addEventListener("click", function() { selectFood(1); });
